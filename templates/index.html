{% extends "base.html" %}

{% block content %}

<h2>Students</h2>

<a href="{{ url_for('add_student') }}" class="btn btn-primary mb-3">Add Student</a>

<form method="GET" class="mb-3">

<input type="text" name="search" placeholder="Search student">

<button class="btn btn-secondary">Search</button>

</form>

<table class="table table-bordered">

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Course</th>
<th>Actions</th>

</tr>

{% for student in students.items %}

<tr>

<td>{{ student.id }}</td>
<td>{{ student.name }}</td>
<td>{{ student.email }}</td>
<td>{{ student.course }}</td>

<td>

<a href="{{ url_for('edit_student', id=student.id) }}" class="btn btn-warning btn-sm">Edit</a>

<a href="{{ url_for('delete_student', id=student.id) }}" class="btn btn-danger btn-sm">Delete</a>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
